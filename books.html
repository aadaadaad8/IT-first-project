<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestselling Books - Book List</title>

  <!-- Load stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Load dataset and table logic in order -->
  <script defer src="data.js"></script>
  <script defer src="table.js"></script>
</head>
<body class="books-page">
  <div class="container">
    <header>
      <h1>Book List</h1>
      <p class="subtitle">Search and browse every book in the dataset.</p>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="books.html" aria-current="page">Book List</a>
      </nav>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search by title, author, genre, language..." 
        aria-label="Search books"
      >
    </section>

    <!-- Table Section -->
    <section class="card">
      <h2>Book List</h2>
      <div class="table-container">
        <table id="booksTable">
          <thead>
            <tr>
              <th>Book</th>
              <th>Cover</th>
              <th>Author(s)</th>
              <th>Original Language</th>
              <th>First Published</th>
              <th>Approximate Sales (Millions)</th>
              <th>Genre</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Table rows will be inserted here by table.js -->
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
