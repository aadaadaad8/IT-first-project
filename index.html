<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestselling Books</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Roboto+Slab:wght@300;400&display=swap">

  <script>
    if (sessionStorage.getItem("bookTransition") === "back-to-list") {
      document.documentElement.classList.add("page-enter-from-right");
    }
  </script>
  <link rel="stylesheet" href="books.css">

  <script defer src="data.js"></script>
  <script defer src="books.js"></script>
</head>
<body>
  <button type="button" id="menuButton" class="menu-button" aria-label="Show or hide the side menu" aria-controls="sideRail">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <nav id="sideRail" class="side-rail" aria-label="Main">
    <div class="rail-top">
      <a class="rail-link" id="booksRailLink" href="index.html" aria-current="page" title="Book List" aria-label="Book List">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
          <path d="M9 3v18M13 8h3"/>
        </svg>
      </a>

      <a class="rail-link" href="charts.html" title="Sales Charts" aria-label="Sales Charts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3v18h18"/>
          <path d="M18 17V9M13 17V5M8 17v-3"/>
        </svg>
      </a>

      <a class="rail-link" href="assistant.html" title="Book Assistant" aria-label="Book Assistant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <path d="M8 9h8M8 13h5"/>
        </svg>
      </a>

      <a class="rail-link" id="savedRailLink" href="index.html?saved=1" title="Saved Books" aria-label="Saved Books">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h12v18l-6-4-6 4z"/>
        </svg>
      </a>
    </div>
  </nav>

  <div class="page">
    <header class="topbar">
      <h1><a href="index.html" class="brand-link">Bestselling Books</a></h1>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Search by title, author, genre, language..."
          aria-label="Search books"
        >
      </label>
    </header>

    <main class="panel">
      <div class="panel-bg" aria-hidden="true"></div>

      <div class="panel-head">
        <div>
          <h2 id="resultsTitle">Most Popular Picks</h2>
          <p id="resultsCount" class="results-count"></p>
        </div>
        <button type="button" id="viewToggle" class="view-toggle" aria-pressed="false" aria-label="Switch between the row view and the grid view with all books" title="Row / grid view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M9 6h11M9 12h11M9 18h11"/>
            <circle cx="4.5" cy="6" r="1" fill="currentColor"/>
            <circle cx="4.5" cy="12" r="1" fill="currentColor"/>
            <circle cx="4.5" cy="18" r="1" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div id="bookGrid" class="book-grid"></div>

      <div class="carousel-nav">
        <button type="button" id="prevButton" class="nav-button" aria-label="Previous books">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button type="button" id="nextButton" class="nav-button" aria-label="Next books">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
