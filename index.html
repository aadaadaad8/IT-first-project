<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestselling Books</title>

  <!-- Load stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Load Chart.js from jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Load dataset, table logic, and chart logic in order -->
  <script defer src="data.js"></script>
  <script defer src="table.js"></script>
  <script defer src="charts.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bestselling Books Explorer</h1>
      <p class="subtitle">Browse, search, and visualize historical book sales data.</p>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search by title, author, genre, language..." 
        aria-label="Search books"
      >
    </section>

    <!-- Table Section -->
    <section class="card">
      <h2>Book List</h2>
      <div class="table-container">
        <table id="booksTable">
          <thead>
            <tr>
              <th>Book</th>
              <th>Author(s)</th>
              <th>Original Language</th>
              <th>First Published</th>
              <th>Approximate Sales (Millions)</th>
              <th>Genre</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Table rows will be inserted here by table.js -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Chart Section -->
    <section class="card">
      <h2>Sales Comparison (Millions)</h2>
      <!-- The container height is set dynamically by charts.js -->
      <div id="chartContainer" class="chart-container">
        <canvas id="salesChart"></canvas>
      </div>
    </section>
  </div>
</body>
</html>
