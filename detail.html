<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details - Bestselling Books</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Roboto+Slab:wght@300;400&display=swap">

  <script>
    if (sessionStorage.getItem("bookTransition") === "to-detail") {
      document.documentElement.classList.add("detail-enter-pending");
    }
  </script>
  <link rel="stylesheet" href="detail.css">

  <script defer src="data.js"></script>
  <script defer src="detail.js"></script>
</head>
<body>
  <div class="hero-art" id="heroArt" aria-hidden="true"></div>

  <header class="detail-top">
    <a class="back-link" id="backLink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M11 6l-6 6 6 6"/>
      </svg>
      <span>Back</span>
    </a>
    <a class="top-search" href="index.html" aria-label="Search books" title="Search books">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="M20 20l-3.5-3.5"/>
      </svg>
    </a>
  </header>

  <main class="stage" id="stage">
    <aside class="sales-note" id="salesNote">
      <svg class="note-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
        <path d="M9 3v18"/>
      </svg>
      <p class="sales-quote">About <strong id="salesBig"></strong> copies sold</p>
      <hr>
      <p class="sales-caption" id="rankText"></p>
    </aside>

    <article class="detail-card" id="detailCard">
      <img class="detail-cover no-cover" id="detailCover" alt="">

      <div class="detail-main">
        <h1 id="bookTitle"></h1>
        <p class="detail-author" id="bookAuthor"></p>

        <dl class="facts">
          <div>
            <dt>First published</dt>
            <dd id="factYear"></dd>
          </div>
          <div>
            <dt>Original language</dt>
            <dd id="factLang"></dd>
          </div>
          <div class="wide">
            <dt>Genre</dt>
            <dd id="factGenre"></dd>
          </div>
        </dl>
      </div>

      <nav class="detail-actions" aria-label="Book actions">
        <button type="button" class="action" id="saveButton" aria-pressed="false">
          <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3h12v18l-6-4-6 4z"/>
          </svg>
          <span id="saveLabel">Save</span>
        </button>

        <a class="action" id="wikiLink" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 11v6M12 7.5v.01"/>
          </svg>
          <span>Learn more</span>
        </a>

        <a class="action" id="findLink" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
          </svg>
          <span>Find Book</span>
        </a>
      </nav>
    </article>

    <p class="not-found" id="notFound" hidden>
      This book was not found in the list.
      <a href="index.html">Back to the Book List</a>
    </p>
  </main>
</body>
</html>
